
spring.application.name=hasdeo-bank
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.jackson.time-zone=Asia/Kolkata

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Respect HTTPS and proxy headers when deployed behind Render
server.forward-headers-strategy=framework

# Google Drive backup: credentials are supplied only through hosting environment variables.
# The scheduler runs daily at 02:00 Asia/Kolkata while the web service is running.

# Optional Gmail SMTP alerts. Configure these as Render Environment Variables.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
