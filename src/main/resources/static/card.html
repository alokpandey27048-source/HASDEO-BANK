<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>HASDEO BANK · Demo Card Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f1efe9;color:#182d40;font-family:Arial,sans-serif}.shell{width:min(100%,520px);background:#fff;border:1px solid #e5e0d5;padding:28px;box-shadow:0 18px 50px #102b4b12}.brand{font:14px Georgia;letter-spacing:2px;color:#17364b}.brand b{color:#b39458}.eyebrow{margin-top:32px;color:#a08045;font-size:9px;letter-spacing:2px;font-weight:bold}.card{margin:18px 0;padding:24px;border-radius:13px;color:white;background:linear-gradient(120deg,#0a2030,#31556b);border:1px solid #b99b5b}.tier-silver{background:linear-gradient(120deg,#46515c,#aeb8c2,#596673)}.tier-gold{background:linear-gradient(120deg,#241d12,#8c6a2c,#332719)}.tier-platinum{background:linear-gradient(120deg,#171d27,#596270,#222a35)}.tier-royal{background:linear-gradient(120deg,#1d1236,#54336f,#201431)}.card-head{display:flex;justify-content:space-between;gap:10px;color:#f0dfb9;font-size:11px;letter-spacing:1px}.tier{font-size:9px;letter-spacing:2px}.number{margin:38px 0 26px;font:19px Georgia;letter-spacing:2px}.holder{font-size:9px;letter-spacing:1.3px;color:#d6dce0}.holder strong{display:block;margin-top:6px;font-size:14px;color:white}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail{padding:13px;background:#f8f8f6}.detail small{display:block;font-size:8px;letter-spacing:1.3px;color:#89939a}.detail strong{display:block;margin-top:7px;font-size:12px;overflow-wrap:anywhere}.notice{margin-top:20px;color:#75818a;font-size:10px;line-height:1.6}.status{display:inline-block;padding:5px 9px;border-radius:20px;background:#e7f4ec;color:#28764a;font-size:10px}.error{padding:30px 10px;text-align:center;color:#7b4b3e}.foot{margin-top:22px;font-size:9px;color:#9aa2a6;text-align:center}
</style></head>
<body><main class="shell"><div class="brand">HASDEO <b>BANK</b></div><div id="content"><p class="error">Loading demo card profile…</p></div><div class="foot">EDUCATIONAL DEMO · NOT A REAL BANK CARD OR ACCOUNT</div></main>
<script>
(async()=>{const root=document.getElementById('content');const token=new URLSearchParams(location.search).get('token')||'';if(!/^[a-fA-F0-9]{48}$/.test(token)){root.innerHTML='<p class="error">This demo card QR is invalid or incomplete.</p>';return;}try{const r=await fetch('/api/public/card/'+encodeURIComponent(token),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.message||'Profile not found');const tier=['Classic','Silver','Gold','Platinum','Royal'].includes(d.cardTier)?d.cardTier:'Classic';const cls=tier==='Classic'?'':('tier-'+tier.toLowerCase());const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));root.innerHTML='<div class="eyebrow">PUBLIC DEMO CARD PROFILE</div><div class="card '+cls+'"><div class="card-head"><b>HASDEO BANK</b><span class="tier">'+esc(tier.toUpperCase())+' CARD</span></div><div class="number">•••• &nbsp; •••• &nbsp; •••• &nbsp; '+esc(d.cardLastFour)+'</div><div class="holder">CARD HOLDER<strong>'+esc(d.name).toUpperCase()+'</strong></div></div><div class="details"><div class="detail"><small>DEMO CUSTOMER ID</small><strong>'+esc(d.customerCode)+'</strong></div><div class="detail"><small>CARD TIER</small><strong>'+esc(tier)+' Card</strong></div><div class="detail"><small>ACCOUNT STATUS</small><strong><span class="status">'+esc(d.status)+'</span></strong></div><div class="detail"><small>CARD NUMBER</small><strong>Ending '+esc(d.cardLastFour)+'</strong></div></div><p class="notice">'+esc(d.notice)+'</p>';}catch(e){root.innerHTML='<p class="error">'+esc(e.message)+'</p>';}})();
</script></body></html>
